app:
  demo-message: "Mensagem atualizada dinamicamente"

spring:
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddRequestHeader=Gateway-Source, api-gateway
          routes:
            - id: product-hub
              uri: lb://product-hub
              predicates:
                - Path=/products/**

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SERVER_URL:http://localhost:8761/eureka/,http://localhost:8762/eureka/}"

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh

  endpoint:
    gateway:
      access: read-only

  info:
    env:
      enabled: true
